name: Release

# Lab stand-in for vercel/ai .github/workflows/release.yml @ fce9210.
# Same workflow NAME and same push/dispatch triggers; the publish job is
# replaced by a no-op so nothing is ever published from this lab.
on:
  push:
    branches:
      - main
      - release-v*
    paths:
      - '.changeset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - run: echo "no-op stand-in for the upstream release job"
