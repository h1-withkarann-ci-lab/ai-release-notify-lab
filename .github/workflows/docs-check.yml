# Fork-side workflow. Its NAME collides with the base repo's "Release"
# workflow, so its completion fires the base repo's "Release Notifications"
# (on: workflow_run, workflows: [Release]) in the base repository context.
name: Release
on: pull_request
permissions: {}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p rn/packages
          echo '{"type":"snapshot"}' > rn/notification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notification
          path: rn
